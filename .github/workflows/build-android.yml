name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Repair Android project & Flutter SDK path
        run: |
          flutter create --platforms=android --org com.huangguo --project-name huangguo_vip .
          python3 -c '
          import os, re
          path = "android/settings.gradle"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              flutter_gradle = os.path.join(os.environ["FLUTTER_ROOT"], "packages", "flutter_tools", "gradle")
              s = re.sub(r"includeBuild\([\"'\''][^\"'\'']*flutter_tools/gradle[\"'\'']\)", f"includeBuild(\x27{flutter_gradle}\x27)", s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
