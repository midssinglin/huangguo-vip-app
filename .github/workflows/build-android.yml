name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Flutter SDK path & AGP version
        run: |
          python3 -c '
          import os, re
          settings_path = "android/settings.gradle"
          with open(settings_path, "r", encoding="utf-8") as f:
              s = f.read()
          flutter_gradle = os.path.join(os.environ["FLUTTER_ROOT"], "packages", "flutter_tools", "gradle")
          s = re.sub(r"includeBuild\([\"'\''][^\"'\'']*flutter_tools/gradle[\"'\'']\)", f"includeBuild(\x27{flutter_gradle}\x27)", s)
          s = re.sub(r"(id\s+[\"'\'']com\.android\.application[\"'\'']\s+version\s+[\"'\''])[^\"'\'']+([\"'\''])", r"\g<1>8.6.0\g<2>", s)
          with open(settings_path, "w", encoding="utf-8") as f:
              f.write(s)

          wrapper_path = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(wrapper_path):
              with open(wrapper_path, "r", encoding="utf-8") as f:
                  w = f.read()
              w = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", r"gradle-8.7-\1.zip", w)
              with open(wrapper_path, "w", encoding="utf-8") as f:
                  f.write(w)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
