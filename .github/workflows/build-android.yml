name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Gradle, AGP & Flutter SDK path
        run: |
          python3 -c '
          import os, re

          sg = "android/settings.gradle"
          with open(sg, "r", encoding="utf-8") as f:
              text = f.read()

          flutter_gradle = os.path.join(os.environ["FLUTTER_ROOT"], "packages", "flutter_tools", "gradle")
          text = re.sub(r"includeBuild\([\"'\''][^\"'\'']*flutter_tools/gradle[\"'\'']\)", f"includeBuild(\x27{flutter_gradle}\x27)", text)
          text = re.sub(r"(com\.android\.application[\"'\'']\s+version\s+[\"'\''])[^\"'\'']+", r"\g<1>8.7.0", text)

          with open(sg, "w", encoding="utf-8") as f:
              f.write(text)

          gw = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(gw, "r", encoding="utf-8") as f:
              wtext = f.read()

          wtext = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", r"gradle-8.9-\1.zip", wtext)

          with open(gw, "w", encoding="utf-8") as f:
              f.write(wtext)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
